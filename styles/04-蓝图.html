<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>04 蓝图</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "YH"; src: local("Microsoft YaHei"); }
      @font-face { font-family: "Mono"; src: local("Consolas"); }
      @font-face { font-family: "Kai"; src: local("KaiTi"); }
      @font-face { font-family: "Song"; src: local("SimSun"); }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: #000; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden;
        background: #0A1A2E; font-family: Mono, sans-serif; color: #CFE3F7; }
      .kick { position: absolute; left: 96px; top: 64px; font-family: Mono; font-size: 14px; letter-spacing: 7px; color: #6FA8DC; }
      .idx { position: absolute; right: 96px; top: 64px; font-family: Mono; font-size: 12px; letter-spacing: 5px; color: #CFE3F7; opacity: 0.42; }
      .rule { position: absolute; left: 96px; right: 96px; height: 1px; background: #CFE3F7; opacity: 0.15; }
      .title { font-weight: 700; letter-spacing: 3px; line-height: 1.08; font-size: 104px; }
      .sub { font-family: Mono; font-size: 26px; letter-spacing: 3px; opacity: 0.6; }
      .note { position: absolute; font-size: 22px; letter-spacing: 2px; opacity: 0.5; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="style-04" data-width="1920" data-height="1080" data-duration="5">

      <div class="kick">04 · 蓝图</div><div class="idx">SCHEMATIC</div>
      <div class="rule" style="top:150px"></div>
      <div class="title" id="t" style="position:absolute;left:96px;bottom:250px;width:1000px">两条通路<br>一快一慢</div>
      <div class="sub" id="s" style="position:absolute;left:100px;bottom:190px">SECTION A-A</div>
      <div class="note" style="left:100px;bottom:26px">蓝底白线 + 尺寸标注</div>
      <svg width="1920" height="1080" viewBox="0 0 1920 1080" style="position:absolute;inset:0">
        <rect x="240" y="180" width="1440" height="720" fill="none" stroke="#6FA8DC" stroke-width="2" opacity="0.5"/><line x1="240" y1="540" x2="1680" y2="540" stroke="#6FA8DC" stroke-width="1" stroke-dasharray="10 10" opacity="0.45"/><circle cx="960" cy="540" r="12" fill="#FFB347"/>
      </svg>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.from("#t", { y: 30, opacity: 0, duration: 0.7, ease: "power3.out" }, 0.1);
      tl.from("#s", { y: 14, opacity: 0, duration: 0.5, ease: "power2.out" }, 0.4);
      tl.from("svg *", { opacity: 0, duration: 0.8, stagger: 0.05, ease: "power2.out" }, 0.45);
      window.__timelines = window.__timelines || {};
      window.__timelines["style-04"] = tl;
    </script>
  </body>
</html>
