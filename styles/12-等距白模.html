<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>12 等距白模</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "YH"; src: local("Microsoft YaHei"); }
      @font-face { font-family: "Mono"; src: local("Consolas"); }
      @font-face { font-family: "Kai"; src: local("KaiTi"); }
      @font-face { font-family: "Song"; src: local("SimSun"); }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: #000; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden;
        background: #ECEAE4; font-family: YH, sans-serif; color: #1F2A33; }
      .kick { position: absolute; left: 96px; top: 64px; font-family: Mono; font-size: 14px; letter-spacing: 7px; color: #E07A3F; }
      .idx { position: absolute; right: 96px; top: 64px; font-family: Mono; font-size: 12px; letter-spacing: 5px; color: #1F2A33; opacity: 0.42; }
      .rule { position: absolute; left: 96px; right: 96px; height: 1px; background: #1F2A33; opacity: 0.15; }
      .title { font-weight: 800; letter-spacing: 2px; line-height: 1.08; font-size: 108px; }
      .sub { font-family: Mono; font-size: 26px; letter-spacing: 3px; opacity: 0.6; }
      .note { position: absolute; font-size: 22px; letter-spacing: 2px; opacity: 0.5; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="style-12" data-width="1920" data-height="1080" data-duration="5">

      <div class="kick">12 · 等距白模</div><div class="idx">ISOMETRIC</div>
      <div class="rule" style="top:150px"></div><div class="rule" style="top:980px"></div>
      <div class="title" id="t" style="position:absolute;left:96px;top:330px;width:900px">三层结构</div>
      <div class="sub" id="s" style="position:absolute;left:100px;top:660px">拆开看</div>
      <div class="note" style="left:100px;bottom:70px">浅灰白 + 30° 轴测方块</div>
      <svg width="1920" height="1080" viewBox="0 0 1920 1080" style="position:absolute;inset:0">
        <g stroke="#1F2A33" stroke-width="3" fill="none"><path d="M 1300 300 L 1440 380 L 1300 460 L 1160 380 Z"/><path d="M 1300 460 L 1440 380 L 1440 540 L 1300 620 Z"/><path d="M 1300 460 L 1160 380 L 1160 540 L 1300 620 Z" fill="#E07A3F" opacity="0.22"/></g>
      </svg>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.from("#t", { y: 30, opacity: 0, duration: 0.7, ease: "power3.out" }, 0.1);
      tl.from("#s", { y: 14, opacity: 0, duration: 0.5, ease: "power2.out" }, 0.4);
      tl.from("svg *", { opacity: 0, duration: 0.8, stagger: 0.05, ease: "power2.out" }, 0.45);
      window.__timelines = window.__timelines || {};
      window.__timelines["style-12"] = tl;
    </script>
  </body>
</html>
