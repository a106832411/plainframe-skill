<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>11 手绘水彩</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "YH"; src: local("Microsoft YaHei"); }
      @font-face { font-family: "Mono"; src: local("Consolas"); }
      @font-face { font-family: "Kai"; src: local("KaiTi"); }
      @font-face { font-family: "Song"; src: local("SimSun"); }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: #000; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden;
        background: #FBF8F1; font-family: YH, sans-serif; color: #3A3A3A; }
      .kick { position: absolute; left: 96px; top: 64px; font-family: Mono; font-size: 14px; letter-spacing: 7px; color: #C98A5B; }
      .idx { position: absolute; right: 96px; top: 64px; font-family: Mono; font-size: 12px; letter-spacing: 5px; color: #3A3A3A; opacity: 0.42; }
      .rule { position: absolute; left: 96px; right: 96px; height: 1px; background: #3A3A3A; opacity: 0.15; }
      .title { font-weight: 800; letter-spacing: 2px; line-height: 1.08; font-size: 104px; }
      .sub { font-family: Mono; font-size: 26px; letter-spacing: 3px; opacity: 0.6; }
      .note { position: absolute; font-size: 22px; letter-spacing: 2px; opacity: 0.5; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="style-11" data-width="1920" data-height="1080" data-duration="5">

      <div class="kick">11 · 手绘水彩</div><div class="idx">WATERCOLOR</div>
      <div class="rule" style="top:150px"></div>
      <div class="title" id="t" style="position:absolute;left:96px;bottom:250px;width:1000px">它是<br>慢慢变的</div>
      <div class="sub" id="s" style="position:absolute;left:100px;bottom:190px">没有一步是突然的</div>
      <div class="note" style="left:100px;bottom:26px">纸白 + 晕染，边界是软的</div>
      <svg width="1920" height="1080" viewBox="0 0 1920 1080" style="position:absolute;inset:0">
        <ellipse cx="1180" cy="420" rx="360" ry="260" fill="#C98A5B" opacity="0.30"/><ellipse cx="1400" cy="640" rx="320" ry="220" fill="#7FA8C9" opacity="0.28"/>
      </svg>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.from("#t", { y: 30, opacity: 0, duration: 0.7, ease: "power3.out" }, 0.1);
      tl.from("#s", { y: 14, opacity: 0, duration: 0.5, ease: "power2.out" }, 0.4);
      tl.from("svg *", { opacity: 0, duration: 0.8, stagger: 0.05, ease: "power2.out" }, 0.45);
      window.__timelines = window.__timelines || {};
      window.__timelines["style-11"] = tl;
    </script>
  </body>
</html>
