<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>17 极简白</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "YH"; src: local("Microsoft YaHei"); }
      @font-face { font-family: "Mono"; src: local("Consolas"); }
      @font-face { font-family: "Kai"; src: local("KaiTi"); }
      @font-face { font-family: "Song"; src: local("SimSun"); }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: #000; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden;
        background: #FAFAF7; font-family: YH, sans-serif; color: #111111; }
      .kick { position: absolute; left: 96px; top: 64px; font-family: Mono; font-size: 14px; letter-spacing: 7px; color: #111111; }
      .idx { position: absolute; right: 96px; top: 64px; font-family: Mono; font-size: 12px; letter-spacing: 5px; color: #111111; opacity: 0.42; }
      .rule { position: absolute; left: 96px; right: 96px; height: 1px; background: #111111; opacity: 0.15; }
      .title { font-weight: 700; letter-spacing: -1px; line-height: 1.08; font-size: 140px; }
      .sub { font-family: Mono; font-size: 26px; letter-spacing: 3px; opacity: 0.6; }
      .note { position: absolute; font-size: 22px; letter-spacing: 2px; opacity: 0.5; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="style-17" data-width="1920" data-height="1080" data-duration="5">

      <div class="kick">17 · 极简白</div><div class="idx">SWISS</div>
      <div class="rule" style="top:150px"></div><div class="rule" style="top:980px"></div>
      <div class="title" id="t" style="position:absolute;left:96px;top:320px;width:820px">少<br>即是多</div>
      <div class="sub" id="s" style="position:absolute;left:100px;top:680px">LESS, BUT BETTER</div>
      <div class="note" style="left:100px;bottom:70px">白底黑字，只有一条线和一个点</div>
      <svg width="1920" height="1080" viewBox="0 0 1920 1080" style="position:absolute;inset:0">
        <circle cx="1420" cy="520" r="180" fill="none" stroke="#111111" stroke-width="2"/><circle cx="1420" cy="520" r="18" fill="#E03E36"/><line x1="240" y1="820" x2="1680" y2="820" stroke="#111111" stroke-width="2"/>
      </svg>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.from("#t", { y: 30, opacity: 0, duration: 0.7, ease: "power3.out" }, 0.1);
      tl.from("#s", { y: 14, opacity: 0, duration: 0.5, ease: "power2.out" }, 0.4);
      tl.from("svg *", { opacity: 0, duration: 0.8, stagger: 0.05, ease: "power2.out" }, 0.45);
      window.__timelines = window.__timelines || {};
      window.__timelines["style-17"] = tl;
    </script>
  </body>
</html>
