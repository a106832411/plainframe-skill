<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>16 终端绿</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "YH"; src: local("Microsoft YaHei"); }
      @font-face { font-family: "Mono"; src: local("Consolas"); }
      @font-face { font-family: "Kai"; src: local("KaiTi"); }
      @font-face { font-family: "Song"; src: local("SimSun"); }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: #000; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden;
        background: #070B07; font-family: Mono, sans-serif; color: #8CFF7A; }
      .kick { position: absolute; left: 96px; top: 64px; font-family: Mono; font-size: 14px; letter-spacing: 7px; color: #C8FF3D; }
      .idx { position: absolute; right: 96px; top: 64px; font-family: Mono; font-size: 12px; letter-spacing: 5px; color: #8CFF7A; opacity: 0.42; }
      .rule { position: absolute; left: 96px; right: 96px; height: 1px; background: #8CFF7A; opacity: 0.15; }
      .title { font-weight: 700; letter-spacing: 3px; line-height: 1.08; font-size: 92px; }
      .sub { font-family: Mono; font-size: 26px; letter-spacing: 3px; opacity: 0.6; }
      .note { position: absolute; font-size: 22px; letter-spacing: 2px; opacity: 0.5; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="style-16" data-width="1920" data-height="1080" data-duration="5">

      <div class="kick">16 · 终端绿</div><div class="idx">TERMINAL</div>
      <div class="rule" style="top:150px"></div><div class="rule" style="top:980px"></div>
      <div class="title" id="t" style="position:absolute;right:150px;top:250px;width:130px;writing-mode:vertical-rl;letter-spacing:14px">loading</div>
      <div class="sub" id="s" style="position:absolute;left:110px;top:300px;writing-mode:vertical-rl">> _</div>
      <div class="note" style="left:110px;bottom:80px">磷光绿 + 光标 + 扫描线</div>
      <svg width="1920" height="1080" viewBox="0 0 1920 1080" style="position:absolute;inset:0">
        <rect x="960" y="260" width="820" height="420" fill="none" stroke="#2F6B33" stroke-width="2"/><text x="1000" y="330" font-family="Mono" font-size="24" fill="#C8FF3D">$ run explain</text><text x="1000" y="386" font-family="Mono" font-size="24" fill="#8CFF7A" opacity="0.7">loading ....... ok</text><rect x="1000" y="420" width="20" height="30" fill="#C8FF3D"/>
      </svg>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.from("#t", { y: 30, opacity: 0, duration: 0.7, ease: "power3.out" }, 0.1);
      tl.from("#s", { y: 14, opacity: 0, duration: 0.5, ease: "power2.out" }, 0.4);
      tl.from("svg *", { opacity: 0, duration: 0.8, stagger: 0.05, ease: "power2.out" }, 0.45);
      window.__timelines = window.__timelines || {};
      window.__timelines["style-16"] = tl;
    </script>
  </body>
</html>
